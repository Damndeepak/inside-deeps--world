<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inside Deep's World</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #202020 0%, transparent 35%),
        #070707;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px 18px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 70px 0 45px;
    }

    .eyebrow {
      color: #666;
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 9px;
      margin-bottom: 18px;
    }

    .title {
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 800;
      letter-spacing: -2.5px;
      line-height: 1;
      background: linear-gradient(180deg, #fff, #858585);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 17px;
    }

    .subtitle {
      color: #777;
      font-size: 13px;
      letter-spacing: .2px;
    }

    /* SECTIONS */

    .sections {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .section {
      position: relative;
      width: 100%;
      padding: 21px 22px;
      border: 1px solid #252525;
      border-radius: 18px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.045), rgba(255,255,255,.01)),
        #0d0d0d;
      color: #f5f5f5;
      text-align: left;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      overflow: hidden;
      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .section::before {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      top: -70px;
      right: -40px;
      background: rgba(255,255,255,.04);
      filter: blur(25px);
      border-radius: 50%;
      transition: .3s ease;
    }

    .section:hover {
      transform: translateY(-3px);
      border-color: #444;
      background: #121212;
      box-shadow: 0 15px 40px rgba(0,0,0,.35);
    }

    .section:hover::before {
      transform: scale(1.5);
    }

    .section:active {
      transform: translateY(-1px) scale(.99);
    }

    .lock {
      float: right;
      color: #666;
      font-size: 13px;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      margin-top: 45px;
      padding-bottom: 20px;
      color: #3d3d3d;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
      animation: modalBg .25s ease;
    }

    .box {
      width: 100%;
      max-width: 390px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.015)),
        #0d0d0d;
      border: 1px solid #303030;
      border-radius: 23px;
      padding: 27px;
      box-shadow:
        0 30px 90px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.04);
      animation: modalBox .3s ease;
    }

    .box h2 {
      font-size: 23px;
      letter-spacing: -.5px;
      margin-bottom: 8px;
    }

    .hint {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 19px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #303030;
      background: #070707;
      color: #fff;
      outline: none;
      font-size: 14px;
      transition: .2s ease;
    }

    input:focus {
      border-color: #666;
      box-shadow: 0 0 0 3px rgba(255,255,255,.035);
    }

    .actions {
      display: flex;
      gap: 9px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #303030;
      background: #161616;
      color: #fff;
      cursor: pointer;
      transition: .2s ease;
    }

    .actions button:hover {
      background: #202020;
    }

    .actions .enter {
      background: #f5f5f5;
      color: #080808;
      border-color: #f5f5f5;
      font-weight: 600;
    }

    .actions .enter:hover {
      background: #dcdcdc;
    }

    .error {
      color: #ff7777;
      font-size: 12px;
      margin-top: 10px;
      min-height: 15px;
    }

    /* UNLOCKED CONTENT */

    #unlockedContent {
      display: none;
      margin-top: 30px;
      padding-bottom: 30px;
      animation: pageIn .45s ease;
    }

    #unlockedContent.active {
      display: block;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 28px;
      color: #777;
      font-size: 12px;
      cursor: pointer;
      transition: .2s ease;
    }

    .back:hover {
      color: #fff;
      transform: translateX(-3px);
    }

    #unlockedContent h2 {
      font-size: 34px;
      letter-spacing: -1.5px;
      margin-bottom: 9px;
    }

    .intro {
      color: #707070;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    /* FRIEND CARDS */

    .friend-card {
      position: relative;
      background:
        linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.01)),
        #0d0d0d;
      border: 1px solid #272727;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 16px;
      box-shadow:
        0 12px 40px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.025);
      overflow: hidden;
      transition: .25s ease;
    }

    .friend-card::before {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      top: -100px;
      right: -70px;
      border-radius: 50%;
      background: rgba(255,255,255,.045);
      filter: blur(25px);
    }

    .friend-card:hover {
      border-color: #3b3b3b;
      transform: translateY(-2px);
      box-shadow: 0 18px 50px rgba(0,0,0,.32);
    }

    .friend-name {
      position: relative;
      font-size: 23px;
      letter-spacing: -.5px;
      margin-bottom: 15px;
    }

    .friend-card p {
      position: relative;
      color: #aaa;
      font-size: 14px;
      line-height: 1.85;
      margin-bottom: 14px;
    }

    .friend-card p:last-child {
      margin-bottom: 0;
    }

    /* SPECIAL CARD */

    .special-card {
      background:
        radial-gradient(
          circle at top right,
          rgba(255,255,255,.09),
          transparent 38%
        ),
        linear-gradient(145deg, #151515, #0a0a0a);
      border-color: #363636;
      padding: 28px;
    }

    .special-card .friend-name {
      letter-spacing: 3px;
    }

    /* EMPTY SECTIONS */

    .empty-section {
      background:
        linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.01)),
        #0d0d0d;
      border: 1px solid #272727;
      border-radius: 20px;
      padding: 27px;
      color: #777;
      line-height: 1.8;
      text-align: center;
    }

    /* ANIMATIONS */

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalBg {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes modalBox {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* MOBILE */

    @media (max-width: 500px) {

      body {
        padding: 20px 15px;
      }

      .hero {
        padding: 50px 0 35px;
      }

      .title {
        letter-spacing: -1.8px;
      }

      .section {
        padding: 19px;
      }

      .friend-card {
        padding: 21px;
        border-radius: 19px;
      }

      #unlockedContent h2 {
        font-size: 29px;
      }

      .friend-name {
        font-size: 21px;
      }

      .friend-card p {
        font-size: 13.5px;
        line-height: 1.8;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <div class="hero">
      <div class="eyebrow">private archive</div>

      <div class="title">
        Inside Deep's World
      </div>

      <div class="subtitle">
        Every section has its own password.
      </div>
    </div>


    <div class="sections" id="sections">

      <button class="section" onclick="openModal('people')">
        Ppl I fw ❤️
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openModal('memories')">
        Memories
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openModal('music')">
        Music
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openModal('socials')">
        Socials
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openModal('random')">
        Random Shit
        <span class="lock">🔒</span>
      </button>

    </div>


    <div id="unlockedContent"></div>


    <div class="footer">
      inside deep's world
    </div>

  </div>


  <!-- PASSWORD MODAL -->

  <div class="modal" id="passwordModal">

    <div class="box">

      <h2 id="modalTitle">Locked</h2>

      <div class="hint" id="modalHint">
        Enter the password to continue.
      </div>

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
        autocomplete="off"
      >

      <div class="actions">

        <button onclick="closeModal()">
          Cancel
        </button>

        <button class="enter" onclick="checkPassword()">
          Enter
        </button>

      </div>

      <div class="error" id="error"></div>

    </div>

  </div>


  <script>

    let currentSection = "";


    const sectionInfo = {

      people: {
        title: "Ppl I fw ❤️",
        hint: "you already know who belongs here."
      },

      memories: {
        title: "Memories",
        hint: "some things are better kept private."
      },

      music: {
        title: "Music",
        hint: "you know the vibe."
      },

      socials: {
        title: "Socials",
        hint: "only if you actually know me."
      },

      random: {
        title: "Random Shit",
        hint: "deep lore."
      }

    };


    const content = {

      people: `

        <span class="back" onclick="goBack()">← back</span>

        <h2>Ppl I fw ❤️</h2>

        <p class="intro">
          I got five friends. One in real life, and four online.
        </p>


        <div class="friend-card">

          <h3 class="friend-name">Om</h3>

          <p>
            He’s the only one I know in real life, and he’s been a part
            of my life in a completely different way from the others.
            Having someone you actually know outside the screen just
            hits different.
          </p>

          <p>
            He’s one of those people who makes the whole “friend”
            thing feel real.
          </p>

        </div>


        <div class="friend-card">

          <h3 class="friend-name">Sharik</h3>

          <p>
            Sharik is my OG friend. I always felt like he was that one
            online friend who was genuinely great to have around.
            We’d always be fucking around, talking shit, and having fun.
            I don’t think I could ever be sad while talking to him.
          </p>

          <p>
            He was, and honestly still is, fucking funny.
            Sharik is an OG, and that’s just it.
          </p>

        </div>


        <div class="friend-card">

          <h3 class="friend-name">Daksh</h3>

          <p>
            Daksh is one of my closest friends. He was probably the
            biggest menace back in 2024. Like, bro, I genuinely miss
            the 2024 version of Daksh.
          </p>

          <p>
            We did so much stupid shit that year, so much fucking
            bakchodi. I don’t even know how to explain it. He could
            somehow turn literally anything into a joke.
          </p>

          <p>
            Nothing ever felt too serious when I was talking to him,
            and I used to laugh so much because of that.
            He’s still one of my favourite people, though.
          </p>

        </div>


        <div class="friend-card">

          <h3 class="friend-name">Diksha</h3>

          <p>
            Diksha is the third one. I found her through the same place
            where I met Sharik. Basically, where I found Sharik,
            I found Diksha too.
          </p>

          <p>
            Me and her actually started off with us arguing a lot.
            But slowly, things started getting better. Eventually,
            we just became friends online, and she turned out to be
            a pretty good friend.
          </p>

          <p>
            She’s funny, easy to talk to, and honestly just a good
            person to have around.
          </p>

          <p>
            And before anyone gets the wrong idea, no, I wasn’t in
            love with her. I could never be in love with her.
            We literally end up fighting every time.
          </p>

          <p>
            She’s just not my type, and honestly, I feel like we’d
            always end up arguing anyway. That’s just how we are.
          </p>

        </div>


        <div class="friend-card special-card">

          <h3 class="friend-name">*******</h3>

          <p>
            She’s not really just a friend to me. She became something
            way more than that over time. I spent more than half a year
            with her, and honestly, I spent more than a year thinking
            about her.
          </p>

          <p>
            That’s a lot of time to have one person constantly somewhere
            in your mind. Somehow, she became a huge part of my life
            without me even realizing how much space she had taken up.
          </p>

          <p>
            Right now, while I’m writing this about you,
            “The Night We Met” is playing in front of me.
            I actually like the timing of that.
          </p>

          <p>
            And honestly, I’m kind of crying on the inside while
            writing this.
          </p>

        </div>

      `,


      memories: `

        <span class="back" onclick="goBack()">← back</span>

        <h2>Memories</h2>

        <p class="intro">
          some moments deserve their own little corner.
        </p>

        <div class="empty-section">
          Memories coming soon...
        </div>

      `,


      music: `

        <span class="back" onclick="goBack()">← back</span>

        <h2>Music</h2>

        <p class="intro">
          songs, playlists, and whatever the fuck is playing in my head.
        </p>

        <div class="empty-section">
          Music coming soon...
        </div>

      `,


      socials: `

        <span class="back" onclick="goBack()">← back</span>

        <h2>Socials</h2>

        <p class="intro">
          places where you can find me online.
        </p>

        <div class="empty-section">
          Socials coming soon...
        </div>

      `,


      random: `

        <span class="back" onclick="goBack()">← back</span>

        <h2>Random Shit</h2>

        <p class="intro">
          absolutely unnecessary information about me.
        </p>

        <div class="empty-section">
          Deep lore loading...
        </div>

      `

    };


    function openModal(section) {

      currentSection = section;

      document.getElementById("modalTitle").textContent =
        sectionInfo[section].title;

      document.getElementById("modalHint").textContent =
        sectionInfo[section].hint;

      document.getElementById("passwordInput").value = "";

      document.getElementById("error").textContent = "";

      document
        .getElementById("passwordModal")
        .classList.add("show");

      setTimeout(() => {
        document.getElementById("passwordInput").focus();
      }, 100);

    }


    function closeModal() {

      document
        .getElementById("passwordModal")
        .classList.remove("show");

    }


    async function checkPassword() {

      const password =
        document.getElementById("passwordInput").value;

      const error =
        document.getElementById("error");


      if (!password) {

        error.textContent = "enter the password.";

        return;
      }


      error.textContent = "checking...";


      try {

        const response = await fetch(
          "/api/check-password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              section: currentSection,
              password: password
            })
          }
        );


        const result = await response.json();


        if (!response.ok || !result.success) {

          error.textContent = "wrong password.";

          return;
        }


        closeModal();

        document.getElementById("sections").style.display = "none";

        const unlocked =
          document.getElementById("unlockedContent");

        unlocked.innerHTML =
          content[currentSection];

        unlocked.classList.add("active");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }


      catch (err) {

        error.textContent =
          "something went wrong. try again.";

      }

    }


    function goBack() {

      const unlocked =
        document.getElementById("unlockedContent");

      unlocked.classList.remove("active");

      unlocked.innerHTML = "";

      document.getElementById("sections").style.display = "flex";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    document
      .getElementById("passwordInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkPassword();
        }

      });


    document
      .getElementById("passwordModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closeModal();
        }

      });

  </script>

</body>
</html>
