nsent-label{font:500 10px/1 DM Mono,monospace;letter-spacing:.18em;text-transform:uppercase;color:#666;margin-bottom:13px}.unsent-card{display:flex;align-items:center;gap:16px;text-decoration:none;color:#fff;padding:18px;border:1px solid #28282b;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.018));transition:.25s ease}.unsent-card:hover{transform:translateY(-2px);border-color:#454549}.unsent-icon{width:58px;height:58px;border-radius:15px;object-fit:cover;flex:none;background:#151515}.unsent-text{min-width:0}.unsent-kicker{font:400 10px/1 DM Mono,monospace;color:#777;margin-bottom:7px}.unsent-name{font-size:17px;font-weight:700}.arrow{margin-left:auto;color:#777;font-size:18px}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.76);backdrop-filter:blur(12px);z-index:20}.modal.show{display:flex}.box{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0d0d0f;border:1px solid #29292d;border-radius:24px;box-shadow:0 30px 100px rgba(0,0,0,.65);padding:28px}.password-box{width:min(430px,100%)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.modal-title{font-size:24px;font-weight:800;letter-spacing:-.035em}.modal-meta{font:400 10px/1.5 DM Mono,monospace;color:#666;margin-top:7px;text-transform:uppercase;letter-spacing:.1em}.close{border:0;background:#18181b;color:#aaa;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}input{width:100%;border:1px solid #303035;background:#141416;color:#fff;border-radius:14px;padding:14px 15px;outline:none;font:500 14px DM Mono,monospace}input:focus{border-color:#666}.unlock{width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;background:#f2f2f2;color:#080808;font-weight:800;cursor:pointer}.error{display:none;color:#e58b8b;font-size:12px;margin-top:10px}.private-note{padding:13px 15px;border:1px solid #242428;border-radius:14px;color:#777;font:400 11px/1.6 DM Mono,monospace;margin-bottom:22px}.friends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.friend{border:1px solid #29292d;border-radius:19px;padding:21px;background:linear-gradient(150deg,rgba(255,255,255,.055),rgba(255,255,255,.012))}.friend.special{grid-column:1/-1;background:radial-gradient(circle at 90% 0%,rgba(180,120,255,.12),transparent 18rem),linear-gradient(150deg,rgba(255,255,255,.065),rgba(255,255,255,.012));border-color:#40364d}.friend-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.friend-name{font-size:19px;font-weight:800;letter-spacing:-.03em}.friend-tag{font:400 9px/1 DM Mono,monospace;color:#68686e;text-transform:uppercase;letter-spacing:.12em}.friend p{color:#aaa;font-size:13px;line-height:1.75;margin:0 0 14px}.friend p:last-child{margin-bottom:0}.quote{color:#d5d5d8!important;font-style:italic;border-left:2px solid #444;padding-left:13px}.placeholder{padding:22px;border:1px dashed #303035;border-radius:16px;color:#777;font:400 12px/1.7 DM Mono,monospace}@media(max-width:650px){.wrap{padding-top:48px}.friends{grid-template-columns:1fr}.friend.special{grid-column:auto}.box{padding:20px;border-radius:20px}.locked{padding:20px}}

<body>
<main class="wrap">
<h1>Inside Deep's World</h1><p class="sub">Every section has its own password and its own hint.<br>You’ll need the right password to unlock each section.</p>
<section class="section-list" aria-label="Private sections">

<button class="locked" data-section="memories"><div class="row"><div><div class="title">Memories</div><div class="hint">A private phrase.</div></div><div class="lock">⌁</div></div></button>

<section class="unsent"><div class="unsent-label">cant express about</div><a class="unsent-card" href="https://share.google/YY2sJslJBKBJZ2irI" target="_blank" rel="noopener noreferrer"><img class="unsent-icon" src="Screenshot_2026-09-06-16-12-05-888_com.android.vending-edit.jpg" alt="The Unsent Project"><div class="unsent-text"><div class="unsent-kicker">Search your name here</div><div class="unsent-name">The Unsent Project</div></div><div class="arrow">↗</div></a></section>

<section class="song-player" aria-label="Wasted music player">
<div class="song-kicker">one little piece</div>
<div class="song-title">Wasted</div>
<div class="song-artist">Juice WRLD ft. Lil Uzi Vert</div>
<div class="lyrics-window"><div id="songPrevious" class="song-lyric previous"></div><div id="songCurrent" class="song-lyric current"></div></div>
<div class="song-controls"><button id="songPlay" class="song-play" type="button" aria-label="Play">▶</button>
<div class="song-progress"><div id="songTrack" class="song-track"><div id="songFill" class="song-fill"></div></div><div class="song-times"><span id="songTime">0:00</span><span>0:27</span></div></div></div>
<audio id="wastedAudio" preload="metadata"><source src="Juice_WRLD_-_Wasted_ft._Lil_Uzi_Vert_(mp3.pm).mp3" type="audio/mpeg"></audio>
</section>
</main>
<div class="modal" id="passwordModal"><div class="box password-box"><div class="modal-head"><div><div class="modal-title" id="passwordTitle">Unlock</div><div class="modal-meta" id="passwordHint"></div></div><button class="close" type="button" onclick="closeAll()">×</button></div><form id="passwordForm"><input id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter password" required><button class="unlock" type="submit">Unlock</button><div class="error" id="error">Wrong password.</div></form></div></div>
<div class="modal" id="contentModal"><div class="box"><div class="modal-head"><div><div class="modal-title" id="contentTitle"></div><div class="modal-meta">private section</div></div><button class="close" type="button" onclick="closeAll()">×</button></div><div id="content"></div></div></div>
<script>
const sectionData={people:{title:"Ppl I fw ❤️",hint:"A date that matters to me"},memories:{title:"Memories",hint:"A private phrase."},music:{title:"Music",hint:"One word. You know the vibe."},socials:{title:"Socials",hint:"A phrase tied to the account."},random:{title:"Random Shit",hint:"A word from the Deep lore."}};
const peopleHTML=`<div class="private-note">Five people. Different places in my life. This stays behind the lock.</div><div class="friends">
<article class="friend"><div class="friend-top"><div class="friend-name">Om</div><div class="friend-tag">real life</div></div><p>He’s the only one I know in real life, and he’s been a part of my life in a completely different way from the others. Having someone you actually know outside the screen just hits different. He’s one of those people who makes the whole “friend” thing feel real.</p></article>
<article class="friend"><div class="friend-top"><div class="friend-name">Sharik</div><div class="friend-tag">OG</div></div><p>Sharik is my OG friend. I always felt like he was that one online friend who was genuinely great to have around. We’d always be fucking around, talking shit, and having fun. I don’t think I could ever be sad while talking to him. He was, and honestly still is, fucking funny. Sharik is an OG, and that’s just it.</p></article>
<article class="friend"><div class="friend-top"><div class="friend-name">Daksh</div><div class="friend-tag">2024 lore</div></div><p>Daksh is one of my closest friends. He was probably the biggest menace back in 2024. Like, bro, I genuinely miss the 2024 version of Daksh. We did so much stupid shit that year, so much fucking bakchodi. I don’t even know how to explain it. He could somehow turn literally anything into a joke. Nothing ever felt too serious when I was talking to him, and I used to laugh so much because of that. He’s still one of my favourite people, though.</p></article>
<article class="friend"><div class="friend-top"><div class="friend-name">Deeksha</div><div class="friend-tag">friend</div></div><p>Deeksha is the third one. I found her through the same place where I met Sharik. Basically, where I found Sharik, I found Deeksha too. Me and her actually started off with us arguing a lot. But slowly, things started getting better. Eventually, we just became friends online, and she turned out to be a pretty good friend. She’s funny, easy to talk to, and honestly just a good person to have around.</p><p>And before anyone gets the wrong idea, no, I wasn’t in love with her. I could never be in love with her. We literally end up fighting every time. She’s just not my type, and honestly, I feel like we’d always end up arguing anyway. That’s just how we are.</p></article>
<article class="friend special"><div class="friend-top"><div class="friend-name">*******</div><div class="friend-tag">more than a friend</div></div><p>She’s not really just a friend to me. She became something way more than that over time. I spent more than half a year with her, and honestly, I spent more than a year thinking about her.</p><p>That’s a lot of time to have one person constantly somewhere in your mind. Somehow, she became a huge part of my life without me even realizing how much space she had taken up.</p><p class="quote">Right now, while I’m writing this about you, “The Night We Met” is playing in front of me. I actually like the timing of that. And honestly, I’m kind of crying on the inside while writing this.</p></article></div>`;
const placeholder='<div class="placeholder">This private corner is locked. Content can be added here without changing the rest of the site.</div>';
let activeSection=null;
document.querySelectorAll('.locked').forEach(btn=>btn.addEventListener('click',()=>{activeSection=btn.dataset.section;passwordTitle.textContent='Unlock '+sectionData[activeSection].title;passwordHint.textContent=sectionData[activeSection].hint;passwordInput.value='';error.style.display='none';passwordModal.classList.add('show');setTimeout(()=>passwordInput.focus(),80)}));
passwordForm.addEventListener('submit',async e=>{e.preventDefault();try{const res=await fetch('/api/check-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({section:activeSection,password:passwordInput.value})});const result=await res.json();if(result.success){passwordModal.classList.remove('show');contentTitle.textContent=sectionData[activeSection].title;content.innerHTML=activeSection==='people'?peopleHTML:placeholder;contentModal.classList.add('show')}else{error.style.display='block'}}catch(err){error.textContent='Something went wrong. Try again.';error.style.display='block'}});
function closeAll(){passwordModal.classList.remove('show');contentModal.classList.remove('show')}document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeAll()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
</script>
<script>
const a=document.getElementById("wastedAudio"),p=document.getElementById("songPlay"),f=document.getElementById("songFill"),t=document.getElementById("songTime"),tr=document.getElementById("songTrack"),pr=document.getElementById("songPrevious"),cu=document.getElementById("songCurrent");
const L=[
[0,`My eyes closed, hopin&#39; this ain&#39;t make-believe`],
[3.7,`And she don&#39;t know that all her demons live in me, yeah`],
[7.1,`I don&#39;t know, I don&#39;t know`],
[9.2,`Don&#39;t know what she been on, I don&#39;t know`],
[12.5,`All that lean I sip on, now watch me pour it`],
[16.0,`One cup on me, don&#39;t got no friends`],
[18.8,`I&#39;m an open door, I ain&#39;t have to let her in`],
[21.8,`She ain&#39;t take my heart, but she took my medicine`],
[24.5,`Least somebody gon&#39; take it, hate to waste it`]
];
let last=-1;
function fmt(x){x=Math.max(0,Math.floor(x));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")}
function lyrics(){
const rel=a.currentTime-198;
let i=-1;
for(let n=0;n<L.length;n++)if(rel>=L[n][0])i=n;
if(i!==last){
last=i;
pr.textContent=i>0?L[i-1][1].replaceAll("&#39;","'"):"";
cu.textContent=i>=0?L[i][1].replaceAll("&#39;","'"):"";
pr.classList.remove("fade-out");cu.classList.remove("fade-out");
}
}
p.onclick=()=>{if(a.paused){if(a.currentTime<198||a.currentTime>=225)a.currentTime=198;a.play();p.textContent="❚❚"}else{a.pause();p.textContent="▶"}};
a.ontimeupdate=()=>{if(a.currentTime<198){a.currentTime=198;return}if(a.currentTime>=225){a.pause();a.currentTime=198;p.textContent="▶";last=-1;return}let rel=a.currentTime-198;f.style.width=(rel/27*100)+"%";t.textContent=fmt(rel)+" / 0:27";lyrics()};
tr.onclick=e=>{a.currentTime=198+(e.offsetX/tr.clientWidth)*27;lyrics()};
a.onended=()=>{p.textContent="▶";a.currentTime=198;last=-1};
const seekStart=()=>{if(!isNaN(a.duration)){a.currentTime=198;lyrics()}};
a.onloadedmetadata=seekStart;
a.oncanplay=()=>{if(a.currentTime<198)a.currentTime=198;lyrics()};
t.textContent="0:00 / 0:27";lyrics();
</script>
