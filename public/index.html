<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Inside Deep's World</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      margin-bottom: 12px;
      letter-spacing: -2px;
    }

    .subtitle {
      color: #a0a0a0;
      font-size: 15px;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .hint-info {
      color: #666;
      font-size: 13px;
      margin-bottom: 35px;
      line-height: 1.5;
    }

    .sections {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-btn {
      width: 100%;
      padding: 20px;
      border: 1px solid #222;
      border-radius: 14px;
      background: #0d0d0d;
      color: white;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .section-btn:hover {
      background: #151515;
      border-color: #444;
      transform: translateY(-2px);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #0d0d0d;
      border: 1px solid #2a2a2a;
      border-radius: 18px;
      padding: 28px;
      text-align: center;
    }

    .modal-box h2 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    .modal-box p {
      color: #888;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #292929;
      background: #050505;
      color: white;
      outline: none;
      font-size: 15px;
      margin-bottom: 12px;
    }

    input:focus {
      border-color: #555;
    }

    .unlock-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: white;
      color: black;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .unlock-btn:hover {
      opacity: 0.85;
    }

    .close-btn {
      margin-top: 15px;
      background: none;
      border: none;
      color: #777;
      cursor: pointer;
      font-size: 14px;
    }

    .error {
      color: #ff5c5c;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .success {
      color: #7cff9b;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Inside Deep's World</h1>

    <p class="subtitle">
      Every section has its own password and its own hint.
    </p>

    <p class="hint-info">
      You’ll need the right password to unlock each section.
    </p>

    <div class="sections">

      <button class="section-btn" onclick="openModal('people')">
        Ppl I fw ❤️
      </button>

      <button class="section-btn" onclick="openModal('memories')">
        Memories
      </button>

      <button class="section-btn" onclick="openModal('music')">
        Music
      </button>

      <button class="section-btn" onclick="openModal('socials')">
        Socials
      </button>

      <button class="section-btn" onclick="openModal('random')">
        Random Shit
      </button>

    </div>
  </div>


  <div class="modal" id="passwordModal">

    <div class="modal-box">

      <h2 id="modalTitle">Unlock</h2>

      <p id="modalHint"></p>

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password"
        autocomplete="off"
      />

      <button class="unlock-btn" onclick="checkPassword()">
        Unlock
      </button>

      <div class="error" id="errorMessage">
        Wrong password.
      </div>

      <div class="success" id="successMessage">
        Unlocked.
      </div>

      <button class="close-btn" onclick="closeModal()">
        Close
      </button>

    </div>

  </div>


  <script>

    let currentSection = "";

    const sectionData = {

      people: {
        title: "Ppl I fw ❤️",
        hint: "A date that matters."
      },

      memories: {
        title: "Memories",
        hint: "A private phrase."
      },

      music: {
        title: "Music",
        hint: "One word. You know the vibe."
      },

      socials: {
        title: "Socials",
        hint: "A phrase tied to the account."
      },

      random: {
        title: "Random Shit",
        hint: "A word from the Deep lore."
      }

    };


    function openModal(section) {

      currentSection = section;

      document.getElementById("modalTitle").textContent =
        sectionData[section].title;

      document.getElementById("modalHint").textContent =
        "Hint: " + sectionData[section].hint;

      document.getElementById("passwordInput").value = "";

      document.getElementById("errorMessage").style.display = "none";
      document.getElementById("successMessage").style.display = "none";

      document.getElementById("passwordModal").style.display = "flex";

      setTimeout(() => {
        document.getElementById("passwordInput").focus();
      }, 100);
    }


    function closeModal() {

      document.getElementById("passwordModal").style.display = "none";

      currentSection = "";
    }


    async function checkPassword() {

      const password =
        document.getElementById("passwordInput").value;

      const errorMessage =
        document.getElementById("errorMessage");

      const successMessage =
        document.getElementById("successMessage");


      errorMessage.style.display = "none";
      successMessage.style.display = "none";


      if (!password) {
        errorMessage.textContent = "Enter a password.";
        errorMessage.style.display = "block";
        return;
      }


      try {

        const response = await fetch("/api/check-password", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            section: currentSection,
            password: password
          })

        });


        const data = await response.json();


        if (data.success) {

          successMessage.textContent = "Unlocked.";
          successMessage.style.display = "block";

          setTimeout(() => {
            closeModal();

            alert("Unlocked. Content will be added here.");

          }, 500);

        } else {

          errorMessage.textContent = "Wrong password.";
          errorMessage.style.display = "block";

        }

      } catch (error) {

        errorMessage.textContent =
          "Something went wrong. Try again.";

        errorMessage.style.display = "block";

      }

    }


    document
      .getElementById("passwordInput")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          checkPassword();
        }

      });


    document
      .getElementById("passwordModal")
      .addEventListener("click", function(event) {

        if (event.target === this) {
          closeModal();
        }

      });

  </script>

</body>
</html>
