<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Inside Deep's World</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      padding: 40px 18px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 38px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 3px;
      color: #777;
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
      line-height: 1.6;
      max-width: 500px;
      margin: 0 auto;
    }

    .hint-info {
      margin-top: 10px;
      color: #555;
      font-size: 12px;
    }

    .sections {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-button {
      width: 100%;
      border: 1px solid #202020;
      background: #0b0b0b;
      color: #f5f5f5;
      padding: 18px 20px;
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      font-size: 15px;
      transition: 0.2s ease;
    }

    .section-button:hover {
      background: #111;
      border-color: #333;
      transform: translateY(-1px);
    }

    .section-button:active {
      transform: translateY(0);
    }

    /* UNSENT PROJECT */

    .unsent-link {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      text-decoration: none;
      color: inherit;
      background: #0b0b0b;
      border: 1px solid #202020;
      border-radius: 14px;
      transition: 0.2s ease;
    }

    .unsent-link:hover {
      background: #111;
      border-color: #333;
      transform: translateY(-1px);
    }

    .unsent-icon {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .unsent-text {
      min-width: 0;
    }

    .unsent-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .unsent-subtitle {
      color: #777;
      font-size: 12px;
    }

    /* PASSWORD MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 390px;
      background: #0c0c0c;
      border: 1px solid #252525;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.5);
    }

    .modal h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .modal-hint {
      color: #777;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .password-input {
      width: 100%;
      background: #050505;
      border: 1px solid #292929;
      color: white;
      border-radius: 10px;
      padding: 13px;
      outline: none;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .password-input:focus {
      border-color: #555;
    }

    .modal-actions {
      display: flex;
      gap: 9px;
    }

    .modal-actions button {
      flex: 1;
      border: 1px solid #292929;
      border-radius: 10px;
      padding: 12px;
      cursor: pointer;
      font-size: 13px;
    }

    .unlock-btn {
      background: #f5f5f5;
      color: #050505;
    }

    .cancel-btn {
      background: #111;
      color: #aaa;
    }

    .status {
      min-height: 18px;
      font-size: 12px;
      margin-bottom: 10px;
      color: #777;
    }

    .status.success {
      color: #8f8;
    }

    .status.error {
      color: #f77;
    }

    /* CONTENT MODAL */

    .content-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(9px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1100;
    }

    .content-modal.active {
      display: flex;
    }

    .content-box {
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      background: #0b0b0b;
      border: 1px solid #242424;
      border-radius: 20px;
      padding: 25px;
    }

    .content-box::-webkit-scrollbar {
      width: 5px;
    }

    .content-box::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 10px;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 24px;
    }

    .content-header h2 {
      font-size: 24px;
    }

    .close-content {
      border: 1px solid #292929;
      background: #111;
      color: #aaa;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 17px;
    }

    .content-text {
      color: #c7c7c7;
      font-size: 14px;
      line-height: 1.8;
    }

    .content-text p {
      margin-bottom: 20px;
    }

    .content-text p:last-child {
      margin-bottom: 0;
    }

    .footer {
      text-align: center;
      color: #444;
      font-size: 11px;
      margin-top: 38px;
    }

    @media (max-width: 520px) {
      body {
        padding: 28px 14px;
      }

      .content-box {
        padding: 20px;
      }

      .content-header h2 {
        font-size: 21px;
      }

      .content-text {
        font-size: 13px;
        line-height: 1.75;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="hero">
      <div class="eyebrow">PRIVATE • PERSONAL • DEEP</div>

      <h1>Inside Deep's World</h1>

      <div class="subtitle">
        Every section has its own password and its own hint.
      </div>

      <div class="hint-info">
        You’ll need the right password to unlock each section.
      </div>
    </section>

    <section class="sections">

      <button class="section-button" data-section="people">
        Ppl I fw ❤️
      </button>

      <!-- THE UNSENT PROJECT -->
      <a
        class="unsent-link"
        href="https://share.google/YY2sJslJBKBJZ2irI"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="unsent-icon"
          src="Screenshot_2026-09-06-16-12-05-888_com.android.vending-edit.jpg"
          alt="The Unsent Project"
        />

        <div class="unsent-text">
          <div class="unsent-title">
            Search your name here
          </div>

          <div class="unsent-subtitle">
            The Unsent Project
          </div>
        </div>
      </a>

      <button class="section-button" data-section="memories">
        Memories
      </button>

      <button class="section-button" data-section="music">
        Music
      </button>

      <button class="section-button" data-section="socials">
        Socials
      </button>

      <button class="section-button" data-section="random">
        Random Shit
      </button>

    </section>

    <div class="footer">
      Inside Deep's World
    </div>

  </main>


  <!-- PASSWORD MODAL -->

  <div class="modal-overlay" id="passwordModal">

    <div class="modal">

      <h2>Unlock section</h2>

      <div class="modal-hint" id="modalHint">
        You’ll need the right password to unlock this section.
      </div>

      <input
        id="passwordInput"
        class="password-input"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
      />

      <div class="status" id="status"></div>

      <div class="modal-actions">

        <button
          class="cancel-btn"
          id="cancelButton"
          type="button"
        >
          Cancel
        </button>

        <button
          class="unlock-btn"
          id="unlockButton"
          type="button"
        >
          Unlock
        </button>

      </div>

    </div>

  </div>


  <!-- CONTENT MODAL -->

  <div class="content-modal" id="contentModal">

    <div class="content-box">

      <div class="content-header">

        <h2 id="contentTitle">
          Section
        </h2>

        <button
          class="close-content"
          id="closeContent"
          type="button"
        >
          ×
        </button>

      </div>

      <div
        class="content-text"
        id="contentText"
      ></div>

    </div>

  </div>


  <script>

    /*
      SECTION HINTS
    */

    const sectionData = {

      people: {
        title: "Ppl I fw ❤️",
        hint: "A date that matters."
      },

      memories: {
        title: "Memories",
        hint: "A private phrase."
      },

      music: {
        title: "Music",
        hint: "One word. You know the vibe."
      },

      socials: {
        title: "Socials",
        hint: "A phrase tied to the account."
      },

      random: {
        title: "Random Shit",
        hint: "A word from the Deep lore."
      }

    };


    /*
      ACTUAL SECTION CONTENT
    */

    const sectionContent = {

      people: [
        `I got five friends. One in real life, and four online.`,

        `The one I know in real life is Om. The four I met online are Sharik, Daksh, Diksha, and *******.`,

        `Sharik is my OG friend. I always felt like he was that one online friend who was genuinely great to have around. We’d always be fucking around, talking shit, and having fun. I don’t think I could ever be sad while talking to him. He was, and honestly still is, fucking funny. Sharik is an OG, and that’s just it.`,

        `Daksh is one of my closest friends. He was probably the biggest menace back in 2024. Like, bro, I genuinely miss the 2024 version of Daksh. We did so much stupid shit that year, so much fucking bakchodi. I don’t even know how to explain it. He could somehow turn literally anything into a joke. Nothing ever felt too serious when I was talking to him, and I used to laugh so much because of that. He’s still one of my favourite people, though.`,

        `Diksha is the third one. I found her through the same place where I met Sharik. Basically, where I found Sharik, I found Diksha too. Me and her actually started off with us arguing a lot. But slowly, things started getting better. Eventually, we just became friends online, and she turned out to be a pretty good friend. She’s funny, easy to talk to, and honestly just a good person to have around.`,

        `And then there’s *******.`,

        `She’s not really just a friend to me. She became something way more than that over time. I spent more than half a year with her, and honestly, I spent more than a year thinking about her.`,

        `That’s a lot of time to have one person constantly somewhere in your mind. Somehow, she became a huge part of my life without me even realizing how much space she had taken up.`,

        `And then there’s Om.`,

        `He’s the only one I know in real life, and he’s been a part of my life in a completely different way from the others. Having someone you actually know outside the screen just hits different. He’s one of those people who makes the whole “friend” thing feel real.`

      ],

      memories: [
        `Private memories go here.`,
        `This section is for things that matter to me and moments I want to keep here.`
      ],

      music: [
        `Music I listen to.`,
        `This is where the songs, artists, albums, and random phases can live.`
      ],

      socials: [
        `My socials.`,
        `This section is for the accounts and places where you can find me online.`
      ],

      random: [
        `Random shit.`,
        `Random things from the Deep lore that don't really belong anywhere else.`
      ]

    };


    /*
      ELEMENTS
    */

    const passwordModal =
      document.getElementById("passwordModal");

    const passwordInput =
      document.getElementById("passwordInput");

    const modalHint =
      document.getElementById("modalHint");

    const status =
      document.getElementById("status");

    const unlockButton =
      document.getElementById("unlockButton");

    const cancelButton =
      document.getElementById("cancelButton");

    const contentModal =
      document.getElementById("contentModal");

    const contentTitle =
      document.getElementById("contentTitle");

    const contentText =
      document.getElementById("contentText");

    const closeContent =
      document.getElementById("closeContent");


    let currentSection = null;


    /*
      OPEN PASSWORD MODAL
    */

    document
      .querySelectorAll(".section-button")
      .forEach(button => {

        button.addEventListener("click", () => {

          currentSection =
            button.dataset.section;

          const data =
            sectionData[currentSection];

          modalHint.textContent =
            data.hint;

          passwordInput.value = "";

          status.textContent = "";

          status.className = "status";

          passwordModal.classList.add("active");

          setTimeout(() => {
            passwordInput.focus();
          }, 100);

        });

      });


    /*
      CLOSE PASSWORD MODAL
    */

    function closePasswordModal() {
      passwordModal.classList.remove("active");
      passwordInput.value = "";
      status.textContent = "";
      status.className = "status";
    }


    cancelButton.addEventListener(
      "click",
      closePasswordModal
    );


    /*
      PASSWORD CHECK
    */

    async function unlockSection() {

      const password =
        passwordInput.value.trim();

      if (!password) {

        status.textContent =
          "Enter a password.";

        status.className =
          "status error";

        return;
      }

      status.textContent =
        "Checking...";

      status.className =
        "status";


      try {

        const response =
          await fetch("/api/check-password", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              section: currentSection,
              password: password
            })

          });


        const result =
          await response.json();


        if (
          response.ok &&
          result &&
          result.success
        ) {

          status.textContent =
            "Unlocked.";

          status.className =
            "status success";


          setTimeout(() => {

            closePasswordModal();

            openContent(
              currentSection
            );

          }, 300);

        } else {

          status.textContent =
            "Wrong password.";

          status.className =
            "status error";

        }

      } catch (error) {

        console.error(error);

        status.textContent =
          "Something went wrong. Try again.";

        status.className =
          "status error";

      }

    }


    unlockButton.addEventListener(
      "click",
      unlockSection
    );


    /*
      ENTER KEY
    */

    passwordInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {
          unlockSection();
        }

        if (event.key === "Escape") {
          closePasswordModal();
        }

      }
    );


    /*
      OPEN CONTENT
    */

    function openContent(section) {

      const data =
        sectionData[section];

      const content =
        sectionContent[section];

      contentTitle.textContent =
        data.title;

      contentText.innerHTML = "";


      content.forEach(paragraph => {

        const p =
          document.createElement("p");

        p.textContent =
          paragraph;

        contentText.appendChild(p);

      });


      contentModal.classList.add("active");

    }


    /*
      CLOSE CONTENT
    */

    function closeContentModal() {

      contentModal.classList.remove(
        "active"
      );

    }


    closeContent.addEventListener(
      "click",
      closeContentModal
    );


    /*
      CLICK OUTSIDE CONTENT
    */

    contentModal.addEventListener(
      "click",
      event => {

        if (
          event.target === contentModal
        ) {

          closeContentModal();

        }

      }
    );


    /*
      ESCAPE KEY
    */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape" &&
          contentModal.classList.contains("active")
        ) {

          closeContentModal();

        }

      }
    );

  </script>

</body>
          </html>
