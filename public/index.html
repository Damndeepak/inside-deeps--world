<style>
/* Dark overlay entrance */
#dark-overlay {
  position: fixed;
  inset: 0;
  background: #000;
  opacity: 1;
  z-index: 9999;
  pointer-events: none;
  animation: fadeOutOverlay 1.2s ease-out forwards;
}

@keyframes fadeOutOverlay {
  to { opacity: 0; visibility: hidden; }
}

/* Smooth transitions for existing elements (optional) */
body {
  overflow-x: hidden;
}

/* Fade-in-up for sections */
.locked,
.unsent-card,
.song-player,
.message-box,
.conversations-section,
.future-tools-section,
.media-entry,
.lfm,
.cx-card,
.friend,
.conversation-card,
.modal .box {
  opacity: 0;
  transform: translateY(20px);
  animation: fadeInUp 0.6s ease-out forwards;
}

/* Stagger delays */
.locked { animation-delay: 0.1s; }
.unsent-card { animation-delay: 0.2s; }
.song-player { animation-delay: 0.3s; }
.message-box { animation-delay: 0.4s; }
.conversations-section { animation-delay: 0.5s; }
.future-tools-section { animation-delay: 0.6s; }
.media-entry { animation-delay: 0.7s; }
.lfm { animation-delay: 0.8s; }
.cx-card { animation-delay: 0.9s; }
.friend { animation-delay: 1.0s; }
.conversation-card { animation-delay: 1.1s; }
.modal .box { animation-delay: 1.2s; }

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Button hover pulse */
.locked:hover,
.unsent-card:hover,
.song-player:hover,
.message-box:hover,
.conversations-section:hover,
.future-tools-section:hover,
.media-entry:hover,
.lfm:hover,
.cx-card:hover,
.friend:hover,
.conversation-card:hover {
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
  70% { box-shadow: 0 0 0 10px rgba(255,255,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  #dark-overlay,
  .locked,
  .unsent-card,
  .song-player,
  .message-box,
  .conversations-section,
  .future-tools-section,
  .media-entry,
  .lfm,
  .cx-card,
  .friend,
  .conversation-card,
  .modal .box {
    animation: none !important;
    transition: none !important;
  }
}
</style>

).replace(/_/g,\"/\");const b=atob(p+\"===\".slice((p.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}\nasync function save(sub){const r=await fetch(\"/api/push/subscribe\",{method:\"POST\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify(sub.toJSON())});return r.ok}\n(async()=>{\n  if(!(\"serviceWorker\" in navigator))return;\n  try{reg=await navigator.serviceWorker.register(\"/sw.js\")}catch(e){return}\n  if(!can){if(ios&&!standalone){bell.hidden=false;bell.addEventListener(\"click\",()=>say(\"iPhone: pehle Add to Home Screen karo, phir app se on karo\"))}return}\n  bell.hidden=false;\n  try{\n    await navigator.serviceWorker.ready;\n    const sub=await reg.pushManager.getSubscription();\n    if(sub&&Notification.permission===\"granted\"){paint(true);save(sub)}else paint(false);\n  }catch(e){paint(false)}\n  bell.addEventListener(\"click\",async()=>{\n    bell.disabled=true;\n    try{\n      await navigator.serviceWorker.ready;\n      const cur=await reg.pushManager.getSubscription();\n      if(cur){\n        fetch(\"/api/push/unsubscribe\",{method:\"POST\",headers:{\"Content-Type\":\"application/json\"},body:JSON.stringify({endpoint:cur.endpoint})}).catch(()=>{});\n        await cur.unsubscribe();paint(false);say(\"Notifications off\");\n      }else{\n        const perm=await Notification.requestPermission();\n        if(perm!==\"granted\"){say(\"Notifications blocked in browser settings\");return}\n        const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:await key()});\n        if(await save(sub)){paint(true);say(\"Notifications on\")}\n        else{await sub.unsubscribe();say(\"Could not turn on, try again\")}\n      }\n    }catch(e){say(\"Could not change notifications\")}\n    finally{bell.disabled=false}\n  });\n})();\n})();\n</script>
