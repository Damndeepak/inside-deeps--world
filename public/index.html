<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inside Deep's World</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #080808;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: auto;
    }

    .hero {
      text-align: center;
      margin: 45px 0 38px;
    }

    .title {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: -1.8px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #8d8d8d;
      font-size: 14px;
    }

    .sections {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section {
      width: 100%;
      padding: 19px 21px;
      border: 1px solid #292929;
      border-radius: 15px;
      background: #101010;
      color: #fff;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .section:hover {
      background: #171717;
      border-color: #444;
      transform: translateY(-2px);
    }

    .lock {
      float: right;
      color: #777;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #4e4e4e;
      font-size: 11px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .box {
      width: 100%;
      max-width: 390px;
      background: #111;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 25px;
    }

    .box h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .hint {
      color: #888;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 11px;
      border: 1px solid #333;
      background: #080808;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #666;
    }

    .actions {
      display: flex;
      gap: 9px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
      padding: 12px;
      border-radius: 11px;
      border: 1px solid #333;
      background: #181818;
      color: #fff;
      cursor: pointer;
    }

    .actions .enter {
      background: #f5f5f5;
      color: #080808;
      border-color: #f5f5f5;
    }

    .error {
      color: #ff7777;
      font-size: 12px;
      margin-top: 10px;
      min-height: 15px;
    }

    @media (max-width: 500px) {
      .title {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="hero">
      <h1 class="title">Inside Deep's World</h1>

      <p class="subtitle">
        Every section has its own password.
      </p>
    </section>

    <div class="sections">

      <button class="section" onclick="openSection('people', 'Ppl I fw ❤️')">
        Ppl I fw ❤️
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openSection('memories', 'Memories')">
        Memories
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openSection('music', 'Music')">
        Music
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openSection('socials', 'Socials')">
        Socials
        <span class="lock">🔒</span>
      </button>

      <button class="section" onclick="openSection('random', 'Random Shit')">
        Random Shit
        <span class="lock">🔒</span>
      </button>

    </div>

    <p class="footer">
      private archive
    </p>

  </main>


  <div id="modal" class="modal">

    <div class="box">

      <h2 id="modalTitle">
        Locked section
      </h2>

      <p id="hint" class="hint"></p>

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="off"
      >

      <div class="actions">

        <button onclick="closeModal()">
          Cancel
        </button>

        <button class="enter" onclick="checkPassword()">
          Unlock
        </button>

      </div>

      <div id="error" class="error"></div>

    </div>

  </div>


  <script>

    let currentSection = null;

    const hints = {

      people:
        "A date that matters.",

      memories:
        "A private phrase.",

      music:
        "One word. You know the vibe.",

      socials:
        "A phrase tied to the account.",

      random:
        "A word from the Deep lore."

    };


    function openSection(section, title) {

      currentSection = section;

      document.getElementById("modalTitle").textContent = title;

      document.getElementById("hint").textContent =
        "Hint: " + hints[section];

      document.getElementById("password").value = "";

      document.getElementById("error").textContent = "";

      document.getElementById("modal").classList.add("show");

      setTimeout(() => {
        document.getElementById("password").focus();
      }, 50);

    }


    function closeModal() {

      document.getElementById("modal").classList.remove("show");

    }


    async function checkPassword() {

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");


      if (!password) {

        error.textContent =
          "Password daal pehle.";

        return;

      }


      error.textContent = "Checking...";


      try {

        const response = await fetch(
          "/api/check-password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              section: currentSection,
              password: password
            })
          }
        );


        if (!response.ok) {

          throw new Error("Wrong password");

        }


        closeModal();


        closeModal();

const content = {
  people: `
    <h2>Ppl I fw ❤️</h2>
    <p>the people who actually matter.</p>
    <div class="card">
      <h3>Friend 1</h3>
      <p>Details coming soon...</p>
    </div>
  `,
  memories: `<h2>Memories</h2><p>Memories coming soon...</p>`,
  music: `<h2>Music</h2><p>Music coming soon...</p>`,
  socials: `<h2>Socials</h2><p>Socials coming soon...</p>`,
  random: `<h2>Random Shit</h2><p>Deep lore loading...</p>`
};

let box = document.getElementById("unlockedContent");

if (!box) {
  box = document.createElement("div");
  box.id = "unlockedContent";
  document.body.appendChild(box);
}

box.innerHTML = content[currentSection];


      } catch (errorObject) {

        error.textContent =
          "Wrong password.";

      }

    }


    document
      .getElementById("password")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

          checkPassword();

        }

      });


    document
      .getElementById("modal")
      .addEventListener("click", function(event) {

        if (event.target.id === "modal") {

          closeModal();

        }

      });

  </script>

</body>
</html>
