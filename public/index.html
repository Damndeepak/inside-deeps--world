<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inside Deep's World</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050505;
      --card: rgba(18, 18, 20, 0.72);
      --line: rgba(255,255,255,.09);
      --muted: #8d8d94;
      --text: #f5f5f7;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(255,255,255,.09), transparent 34%),
        radial-gradient(circle at 10% 80%, rgba(255,255,255,.035), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 34px 18px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    .container {
      width: 100%;
      max-width: 720px;
      position: relative;
      z-index: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
      animation: rise .7s ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #77777d;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.8px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 22px;
      height: 1px;
      background: #333338;
    }

    h1 {
      font-size: clamp(42px, 9vw, 72px);
      line-height: .98;
      font-weight: 760;
      letter-spacing: -3.5px;
      margin-bottom: 17px;
      background: linear-gradient(180deg, #fff 0%, #bdbdc2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #a1a1a8;
      font-size: 14px;
      line-height: 1.65;
      margin-bottom: 5px;
    }

    .hint-info {
      color: #65656c;
      font-size: 12px;
      line-height: 1.5;
    }

    .sections {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .section-btn {
      width: 100%;
      min-height: 70px;
      padding: 17px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        rgba(25,25,27,.82),
        rgba(12,12,13,.78)
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 12px 35px rgba(0,0,0,.16);
      color: #f4f4f5;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -.15px;
      cursor: pointer;
      text-align: left;
      transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease;
      position: relative;
      overflow: hidden;
    }

    .section-btn::after {
      content: "↗";
      color: #6d6d74;
      font-size: 16px;
      transition: transform .22s ease, color .22s ease;
    }

    .section-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        transparent 20%,
        rgba(255,255,255,.055),
        transparent 80%
      );
      transform: translateX(-110%);
      transition: transform .55s ease;
    }

    .section-btn:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,.18);
      background: linear-gradient(
        135deg,
        rgba(30,30,32,.92),
        rgba(14,14,15,.88)
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 18px 45px rgba(0,0,0,.27);
    }

    .section-btn:hover::before {
      transform: translateX(110%);
    }

    .section-btn:hover::after {
      transform: translate(2px,-2px);
      color: #aaaab0;
    }

    /* THE UNSENT PROJECT */

    .unsent-link {
      width: 100%;
      min-height: 86px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        rgba(25,25,27,.82),
        rgba(12,12,13,.78)
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.035),
        0 12px 35px rgba(0,0,0,.16);
      color: #f4f4f5;
      transition:
        transform .22s ease,
        border-color .22s ease,
        background .22s ease,
        box-shadow .22s ease;
      position: relative;
      overflow: hidden;
    }

    .unsent-link::after {
      content: "↗";
      margin-left: auto;
      color: #6d6d74;
      font-size: 16px;
      transition: transform .22s ease, color .22s ease;
    }

    .unsent-link:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,.18);
      background: linear-gradient(
        135deg,
        rgba(30,30,32,.92),
        rgba(14,14,15,.88)
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05),
        0 18px 45px rgba(0,0,0,.27);
    }

    .unsent-link:hover::after {
      transform: translate(2px,-2px);
      color: #aaaab0;
    }

    .unsent-icon {
      width: 58px;
      height: 58px;
      min-width: 58px;
      border-radius: 14px;
      object-fit: cover;
      object-position: center;
      background: #f4f1e7;
      border: 1px solid rgba(255,255,255,.12);
    }

    .unsent-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .unsent-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.15px;
    }

    .unsent-subtitle {
      color: #85858c;
      font-size: 12px;
      line-height: 1.4;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,.76);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 410px;
      background: linear-gradient(
        145deg,
        rgba(25,25,27,.96),
        rgba(10,10,11,.97)
      );
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
      box-shadow:
        0 30px 90px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.05);
      animation: modalIn .22s ease both;
    }

    .modal-box h2 {
      margin-bottom: 9px;
      font-size: 24px;
      letter-spacing: -.7px;
    }

    .modal-box p {
      color: #85858c;
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.55;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      border: 1px solid #2c2c30;
      background: #080809;
      color: white;
      outline: none;
      font-size: 15px;
      margin-bottom: 11px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }

    input:focus {
      border-color: #66666d;
      box-shadow: 0 0 0 4px rgba(255,255,255,.035);
    }

    .unlock-btn {
      width: 100%;
      padding: 14px;
      border: 1px solid #fff;
      border-radius: 13px;
      background: #f4f4f4;
      color: #070707;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, opacity .18s ease;
    }

    .unlock-btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .close-btn {
      margin-top: 15px;
      background: none;
      border: none;
      color: #6e6e75;
      cursor: pointer;
      font-size: 13px;
    }

    .error {
      color: #ff7373;
      font-size: 12px;
      margin-top: 11px;
      display: none;
    }

    .success {
      color: #8cffaa;
      font-size: 12px;
      margin-top: 11px;
      display: none;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 500px) {
      body {
        padding: 25px 15px;
        align-items: flex-start;
        padding-top: 70px;
      }

      h1 {
        letter-spacing: -2.5px;
      }

      .hero {
        margin-bottom: 28px;
      }

      .section-btn {
        min-height: 64px;
        border-radius: 16px;
      }

      .unsent-link {
        min-height: 76px;
        border-radius: 16px;
      }

      .unsent-icon {
        width: 50px;
        height: 50px;
        min-width: 50px;
        border-radius: 12px;
      }

      .modal-box {
        padding: 25px 20px;
        border-radius: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <section class="hero">
      <div class="eyebrow">PRIVATE • PERSONAL • DEEP</div>

      <h1>Inside Deep's World</h1>

      <p class="subtitle">
        Every section has its own password and its own hint.
      </p>

      <p class="hint-info">
        You’ll need the right password to unlock each section.
      </p>
    </section>


    <div class="sections">

      <!-- PASSWORD SECTION -->
      <button class="section-btn" onclick="openModal('people')">
        Ppl I fw ❤️
      </button>


      <!-- THE UNSENT PROJECT -->
      <a
        class="unsent-link"
        href="https://share.google/YY2sJslJBKBJZ2irI"
        target="_blank"
        rel="noopener noreferrer"
      >

        <img
          class="unsent-icon"
          src="Screenshot_2026-09-06-16-12-05-888_com.android.vending-edit.jpg"
          alt="The Unsent Project"
        />

        <div class="unsent-text">
          <div class="unsent-title">
            Search your name here
          </div>

          <div class="unsent-subtitle">
            The Unsent Project
          </div>
        </div>

      </a>


      <!-- OTHER PASSWORD SECTIONS -->
      <button class="section-btn" onclick="openModal('memories')">
        Memories
      </button>

      <button class="section-btn" onclick="openModal('music')">
        Music
      </button>

      <button class="section-btn" onclick="openModal('socials')">
        Socials
      </button>

      <button class="section-btn" onclick="openModal('random')">
        Random Shit
      </button>

    </div>

  </div>


  <!-- PASSWORD MODAL -->

  <div class="modal" id="passwordModal">

    <div class="modal-box">

      <h2 id="modalTitle">
        Unlock
      </h2>

      <p id="modalHint"></p>

      <input
        type="password"
        id="passwordInput"
        placeholder="Enter password"
        autocomplete="off"
      />

      <button class="unlock-btn" onclick="checkPassword()">
        Unlock
      </button>

      <div class="error" id="errorMessage">
        Wrong password.
      </div>

      <div class="success" id="successMessage">
        Unlocked.
      </div>

      <button class="close-btn" onclick="closeModal()">
        Close
      </button>

    </div>

  </div>


  <script>

    let currentSection = "";

    const sectionData = {

      people: {
        title: "Ppl I fw ❤️",
        hint: "A date that matters."
      },

      memories: {
        title: "Memories",
        hint: "A private phrase."
      },

      music: {
        title: "Music",
        hint: "One word. You know the vibe."
      },

      socials: {
        title: "Socials",
        hint: "A phrase tied to the account."
      },

      random: {
        title: "Random Shit",
        hint: "A word from the Deep lore."
      }

    };


    function openModal(section) {

      currentSection = section;

      document.getElementById("modalTitle").textContent =
        sectionData[section].title;

      document.getElementById("modalHint").textContent =
        "Hint: " + sectionData[section].hint;

      document.getElementById("passwordInput").value = "";

      document.getElementById("errorMessage").style.display =
        "none";

      document.getElementById("successMessage").style.display =
        "none";

      document.getElementById("passwordModal").style.display =
        "flex";

      setTimeout(() => {

        document.getElementById("passwordInput").focus();

      }, 100);

    }


    function closeModal() {

      document.getElementById("passwordModal").style.display =
        "none";

      currentSection = "";

    }


    async function checkPassword() {

      const password =
        document.getElementById("passwordInput").value;

      const errorMessage =
        document.getElementById("errorMessage");

      const successMessage =
        document.getElementById("successMessage");


      errorMessage.style.display = "none";

      successMessage.style.display = "none";


      if (!password) {

        errorMessage.textContent =
          "Enter a password.";

        errorMessage.style.display =
          "block";

        return;

      }


      try {

        const response = await fetch(
          "/api/check-password",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              section: currentSection,
              password: password
            })
          }
        );


        const data = await response.json();


        if (data.success) {

          successMessage.textContent =
            "Unlocked.";

          successMessage.style.display =
            "block";


          setTimeout(() => {

            closeModal();

            alert(
              "Unlocked. Content will be added here."
            );

          }, 500);

        } else {

          errorMessage.textContent =
            "Wrong password.";

          errorMessage.style.display =
            "block";

        }

      } catch (error) {

        errorMessage.textContent =
          "Something went wrong. Try again.";

        errorMessage.style.display =
          "block";

      }

    }


    document
      .getElementById("passwordInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            checkPassword();

          }

        }
      );


    document
      .getElementById("passwordModal")
      .addEventListener(
        "click",
        function(event) {

          if (event.target === this) {

            closeModal();

          }

        }
      );

  </script>

</body>
</html>
