</style></head><body><div class="room"><div class="wall"></div><div class="floor"></div><div class="light"></div><div class="window"></div><div class="poster"></div><div class="shelf"><i></i><i></i><i></i><i></i><i></i></div><div class="bed"><div class="pillow"></div></div><div class="rug"></div><div class="desk"></div><div class="monitor-wrap" data-open="terminal"><div class="monitor"><div class="screen"><b>DEEP_OS</b><span>CLICK TO ACCESS</span></div></div></div><div class="keyboard" data-open="keyboard"></div><div class="pc" data-open="pc"></div><div class="chair"></div><div class="cup" data-open="cup"></div><div class="drawer" data-open="drawer"></div><div class="ui"><div class="top"><span>THE ROOM</span><span>DEEP // 01</span></div><div class="hint">explore the room • some things aren't what they look like</div><button class="back" onclick="history.back()">← BACK</button></div><div class="modal" id="modal"><div class="panel" id="panel"></div></div></div><script>const m=document.getElementById('modal'),p=document.getElementById('panel');const c={terminal:['DEEP_OS // TERMINAL','<div class="terminal">deep@room:~$ whoami<br>deep<br><br>deep@room:~$ ls<br>memories/ thoughts/ unfinished/ secrets/<br><br>deep@room:~$ _</div>'],pc:['THE MACHINE','<p>the PC is still running.</p><p>one process is open: <b style="color:#ccc">DEEP_WORLD.exe</b></p>'],keyboard:['KEYBOARD','<p>some keys are worn out.</p><p style="margin-top:10px">D • E • E • P</p>'],cup:['THE CUP','<p>cold coffee.</p><p style="margin-top:10px;color:#555">probably abandoned hours ago.</p>'],drawer:['DRAWER','<p>locked.</p><p style="margin-top:10px">maybe the room has a key somewhere.</p>']};document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{let x=c[e.dataset.open];p.innerHTML='<h2>'+x[0]+'</h2>'+x[1]+'<button class="close" onclick="m.classList.remove(\'show\')">CLOSE</button>';m.classList.add('show')});m.onclick=e=>{if(e.target===m)m.classList.remove('show')};</script></body></html>
